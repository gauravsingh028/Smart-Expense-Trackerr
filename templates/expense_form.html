{% extends "base.html" %}

{% block content %}
<div style="max-width:680px;margin:0 auto">
    <div class="panel">
        <div class="panel-header">
            <h2>{% if editing %}Edit Expense{% else %}Add New Expense{% endif %}</h2>
        </div>
        <div class="panel-body">
            <form method="post" id="expense-form">
                {% csrf_token %}

                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount (₹) *</label>
                        <input type="number" name="amount" id="amount" class="form-control"
                               step="0.01" min="0.01" required
                               placeholder="e.g. 1250.00"
                               value="{% if editing %}{{ expense.amount_dec }}{% endif %}">
                    </div>
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" name="date" id="date" class="form-control" required
                               value="{% if editing %}{{ expense.date_str }}{% else %}{{ today }}{% endif %}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <input type="text" name="description" id="description" class="form-control"
                           required maxlength="500"
                           placeholder="e.g. Grocery shopping at BigBasket"
                           value="{% if editing %}{{ expense.description }}{% endif %}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select name="category" id="category" class="form-select" required>
                            <option value="">Select category</option>
                            {% for cat in categories %}
                            <option value="{{ cat }}"
                                {% if editing and expense.category == cat %}selected{% endif %}>
                                {{ cat }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="payment_method">Payment Method *</label>
                        <select name="payment_method" id="payment_method" class="form-select" required>
                            <option value="">Select method</option>
                            {% for pm in payment_methods %}
                            <option value="{{ pm }}"
                                {% if editing and expense.payment_method == pm %}selected{% endif %}>
                                {{ pm }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes (optional)</label>
                    <textarea name="notes" id="notes" class="form-control"
                              placeholder="Any additional details..."
                              maxlength="1000">{% if editing %}{{ expense.notes }}{% endif %}</textarea>
                </div>

                <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px">
                    <a href="{% if editing %}{% url 'transactions' %}{% else %}{% url 'dashboard' %}{% endif %}"
                       class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary" id="save-expense-btn">
                        <i data-lucide="{% if editing %}save{% else %}plus{% endif %}" style="width:16px;height:16px"></i>
                        {% if editing %}Save Changes{% else %}Add Expense{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>lucide.createIcons();</script>
{% endblock %}
