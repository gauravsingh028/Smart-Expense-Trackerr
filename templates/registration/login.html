{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ExpenseTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand">
            <div class="icon">
                <i data-lucide="wallet" style="width:30px;height:30px"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to your ExpenseTrack account</p>
        </div>

        {% if messages %}
        <div style="margin-bottom:20px">
            {% for message in messages %}
            <div class="alert-toast {{ message.tags }}" style="position:static;animation:none;margin-bottom:8px">
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" id="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control"
                       required autofocus placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control"
                       required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn">
                <i data-lucide="log-in" style="width:16px;height:16px"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Create one</a>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
