{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ExpenseTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand">
            <div class="icon">
                <i data-lucide="wallet" style="width:24px;height:24px"></i>
            </div>
            <h2>Create Account</h2>
            <p>Start tracking your expenses today</p>
        </div>

        {% if messages %}
        <div style="margin-bottom:20px">
            {% for message in messages %}
            <div class="alert-toast {{ message.tags }}" style="position:static;animation:none;margin-bottom:8px">
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" id="register-form">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" name="first_name" id="first_name" class="form-control"
                           placeholder="John">
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" name="last_name" id="last_name" class="form-control"
                           placeholder="Doe">
                </div>
            </div>
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" name="username" id="username" class="form-control"
                       required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" name="email" id="email" class="form-control"
                       required placeholder="you@example.com">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password1">Password *</label>
                    <input type="password" name="password1" id="password1" class="form-control"
                           required placeholder="Min 8 characters" minlength="8">
                </div>
                <div class="form-group">
                    <label for="password2">Confirm Password *</label>
                    <input type="password" name="password2" id="password2" class="form-control"
                           required placeholder="Repeat password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="register-btn">
                <i data-lucide="user-plus" style="width:16px;height:16px"></i> Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
